name: Publish

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish (e.g. v0.1.0). Must exist in the repo."
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Missing tag name" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify release
        run: npm run check

      - name: Validate tag version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${{ steps.meta.outputs.tag }}" = "v${package_version}"

      - name: Assemble installable plugin
        shell: bash
        run: |
          mkdir -p release-package/dist
          cp package.json README.md LICENSE icon.svg release-package/
          cp dist/index.js release-package/dist/
          (
            cd release-package
            zip -r "../logseq-plus-minus-next-${{ steps.meta.outputs.tag }}.zip" .
          )

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: logseq-plus-minus-next-${{ steps.meta.outputs.tag }}.zip
          fail_on_unmatched_files: true
