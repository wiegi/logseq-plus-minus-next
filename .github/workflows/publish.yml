name: Publish Logseq plugin

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run check

      - name: Validate tag version
        if: github.event_name == 'release'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Assemble installable plugin
        shell: bash
        run: |
          mkdir -p release-package/dist
          cp package.json README.md LICENSE icon.svg release-package/
          cp dist/index.js release-package/dist/
          (
            cd release-package
            zip -r "../logseq-plus-minus-next-${GITHUB_REF_NAME}.zip" .
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-plus-minus-next-${{ github.ref_name }}
          path: logseq-plus-minus-next-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "logseq-plus-minus-next-${GITHUB_REF_NAME}.zip"
          --clobber
